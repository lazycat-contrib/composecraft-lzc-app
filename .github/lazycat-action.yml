version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/composecraft.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: saas
build:
  run_buildscript: false
images:
  - id: saas
    target: service
    service: saas
    source: composecraft/composecraft
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
  - id: db
    target: service
    service: db
    source: library/mongo
    channel: stable
    sort: semver
    tag_regex: '^8\.0\.\d+$'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Compose Craft
    summary: "以图形用户界面 (GUI) 的方式管理、编辑和共享 Docker Compose 文件的工具。"
